services:
  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: moodle_mysql
    restart: unless-stopped
    ports:
      - "9001:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moodle}
      MYSQL_USER: ${MYSQL_USER:-moodleuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moodlepassword}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-file-per-table=1
      --max-allowed-packet=512M
      --innodb-buffer-pool-size=512M
      --innodb-redo-log-capacity=536870912
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --default-storage-engine=InnoDB
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - moodle_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Moodle Application
  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodle_app
    restart: unless-stopped
    ports:
      - "9000:80"
    environment:
      # Database configuration
      MOODLE_DATABASE_TYPE: mysqli
      MOODLE_DATABASE_HOST: mysql
      MOODLE_DATABASE_NAME: ${MYSQL_DATABASE:-moodle}
      MOODLE_DATABASE_USER: ${MYSQL_USER:-moodleuser}
      MOODLE_DATABASE_PASSWORD: ${MYSQL_PASSWORD:-moodlepassword}
      MOODLE_DATABASE_PORT: 3306
      MOODLE_DATABASE_PREFIX: mdl_
      
      # Site configuration
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:9000}
      MOODLE_SITE_FULLNAME: ${MOODLE_SITE_FULLNAME:-Moodle Site}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-Moodle}
      MOODLE_SITE_SUMMARY: ${MOODLE_SITE_SUMMARY:-Moodle Learning Management System}
      
      # Admin account (CHANGE THESE IN PRODUCTION!)
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-Admin@123}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      
      # PHP settings
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_EXECUTION_TIME: 300
    volumes:
      # Mount source code for development (use bind mount for live editing)
      # If you don't need live editing, comment this out for better performance
      - ./:/var/www/html:rw
      # Mount moodledata directory (persistent storage)
      - moodle_data:/var/www/moodledata:rw
      # Mount config.php if exists (for easier config management)
      # - ./config.php:/var/www/html/config.php:rw
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - moodle_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: moodle_phpmyadmin
    restart: unless-stopped
    ports:
      - "9002:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 512M
      MAX_EXECUTION_TIME: 300
      PMA_ARBITRARY: 1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - moodle_network
  # MailHog (for testing emails in development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: moodle_mailhog
    restart: unless-stopped
    ports:
      - "9003:8025"  # Web UI
      - "1025:1025"   # SMTP
    networks:
      - moodle_network
volumes:
  mysql_data:
    driver: local
  moodle_data:
    driver: local

networks:
  moodle_network:
    driver: bridge
